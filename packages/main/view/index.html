    .big-text { font-size: calc(var(--htm-size) * 2); }

  <script type="module">// _@ts-check 'use strict';
    import {
      ge, gt, qs, qa, when,
      jsonStringify, getEnvironment,
    } from './imported/lib/view/view.js';
    import { dummySharedMethod } from './imported/core/shared.js';
    import config from './config.js';
    //
    const appendBr = (el) => el.insertAdjacentHTML('beforeend', `<br/>`);
    when(() => document.body, () => {
      console.log(` view qs: ` + qs('#some-id')?.innerHTML);
      document.body.append(`config: ${jsonStringify(config)} `);
      appendBr(document.body);
      document.body.append(`getEnvironment: ${jsonStringify(getEnvironment())} `);
      appendBr(document.body);
      document.body.append(`dummySharedMethod: ${dummySharedMethod(1, 2, 3)} `);
      appendBr(document.body);
    });
  </script>
</head><body bgcolor="#808080">
  <div id="some-id" style="width: 100%;" class="display-flex justify-center big-text">Hello, world!</div>
